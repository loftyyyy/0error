services:
  postgres:
    image: postgres:18-alpine
    container_name: 0error-postgres
    environment:
      POSTGRES_DB: 0error
      POSTGRES_USER: 0error
      POSTGRES_PASSWORD: 0error_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps clusters in a versioned subdirectory of this mount.
      - 0error-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 0error -d 0error"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  0error-pgdata:
