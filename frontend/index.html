<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="0Error is a calm, minimal touch-typing tutor. Learn the home row first."
    />
    <title>0Error - learn to touch-type</title>
    <script>
      // Applied before the first paint so a dark session never flashes light.
      try {
        var storedTheme = localStorage.getItem('0error-theme')
        var prefersDark =
          storedTheme === 'dark' ||
          (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', prefersDark)
      } catch (error) {
        // Storage or matchMedia may be blocked; the light default stands.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
