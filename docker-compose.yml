services:
  postgres:
    image: postgres:18-alpine
    container_name: 0error-postgres
    environment:
      POSTGRES_DB: 0error
      POSTGRES_USER: 0error
      POSTGRES_PASSWORD: 0error_dev
    ports:
      - "5432:5432"
    volumes:
      - 0error-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 0error -d 0error"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: 0error-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - 0error-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  0error-pgdata:
  0error-redisdata:
